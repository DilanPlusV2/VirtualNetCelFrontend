<span>

<span>

    <img
        src="/mail.png"

    <div class="right">

        href="https://www.facebook.com/VirtualNet"

            src="/facebook.png"
            alt="Facebook">

    </a>

    <a
        href="https://www.instagram.com/virtualnet"

            src="/instagram.png"

        <div class="account">

            <span class="account-button">

    <img
        src="/user.png"
        class="account-icon"
        alt="Mi cuenta">

    <span>

        Mi cuenta

    </span>

</span>

            <div class="login-dropdown">

    <ng-container *ngIf="!user; else loggedUser">

        <input
        type="email"
        [(ngModel)]="email"
        placeholder="Correo">

        <input
        type="password"
        [(ngModel)]="password"
        placeholder="Contraseña">

        <label class="remember">

            <input type="checkbox">

            Recordarme

        </label>

        <button
        (click)="login()">

            {{loading?'Ingresando...':'Iniciar sesión'}}

        </button>

        <p
        *ngIf="error"
        style="color:red">

            {{error}}

        </p>

    </ng-container>

    <ng-template #loggedUser>

        <strong>

            {{user.nombre}}

        </strong>

        <small>

            {{user.email}}

        </small>

        <button
        (click)="router.navigate(['/admin'])">

            Panel administrativo

        </button>

        <button
        (click)="logout()">

            Cerrar sesión

        </button>

    </ng-template>

</div>

        </div>

    </div>

</div>
