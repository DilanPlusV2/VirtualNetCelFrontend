<div class="page">

    <h1>Categorías</h1>

    <div class="toolbar">

        <input
            type="text"
            [(ngModel)]="search"
            (input)="filter()"
            placeholder="Buscar categoría...">

        <button (click)="newCategory()">

            + Nueva Categoría

        </button>

    </div>

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Nombre</th>

                    <th>Descripción</th>

                    <th width="180">
                        Acciones
                    </th>

                </tr>

            </thead>

            <tbody>

                <tr *ngFor="let c of filteredCategories">

                    <td>{{c.nombre}}</td>

                    <td>{{c.descripcion}}</td>

                    <td>

    <div class="actions">

        <button
            class="edit"
            (click)="edit(c)">

            Editar

        </button>

        <button
            class="delete"
            (click)="delete(c)">

            Eliminar

        </button>

    </div>

</td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

<div
    class="modal"
    *ngIf="showModal">

    <div class="card">

        <h2>

            {{editing ? 'Editar' : 'Nueva'}}

            Categoría

        </h2>

        <label>

            Nombre

        </label>

        <input
            [(ngModel)]="form.nombre">

        <label>

            Descripción

        </label>

        <textarea
            [(ngModel)]="form.descripcion">

        </textarea>

        <div class="buttons">

            <button
                class="cancel"
                (click)="showModal=false">

                Cancelar

            </button>

            <button
                class="save"
                (click)="save()">

                Guardar

            </button>

        </div>

    </div>

</div>
