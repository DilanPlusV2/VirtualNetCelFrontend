<div
class="modal"
*ngIf="show">

<div class="card">

<div class="header">

<h2>

Servicios realizados

</h2>

<button

class="new"

(click)="newCompleted()">

Nuevo

</button>

</div>

<div class="form">

<input

placeholder="Cliente"

[(ngModel)]="form.cliente">

<input

placeholder="Empresa"

[(ngModel)]="form.empresa">

<input

placeholder="Teléfono"

[(ngModel)]="form.telefono">

<input

placeholder="Dirección"

[(ngModel)]="form.direccion">

<input

placeholder="Ciudad"

[(ngModel)]="form.ciudad">

<input

placeholder="Técnico"

[(ngModel)]="form.tecnico">

<input

type="date"

[(ngModel)]="form.fecha">

<input

type="number"

placeholder="Valor"

[(ngModel)]="form.valor_cobrado">

<textarea

rows="3"

placeholder="Observaciones"

[(ngModel)]="form.observaciones">

</textarea>

<textarea

rows="3"

placeholder="Testimonio"

[(ngModel)]="form.testimonio">

</textarea>

<label>

<input

type="checkbox"

[(ngModel)]="form.descontar_inventario">

Descontar inventario

</label>

<select

[(ngModel)]="form.estado">

<option>

FINALIZADO

</option>

<option>

PENDIENTE

</option>

<option>

CANCELADO

</option>

</select>

<button

class="save"

(click)="save()">

{{editing?'Actualizar':'Guardar'}}

</button>

</div>

<table>

<thead>

<tr>

<th>

Cliente

</th>

<th>

Fecha

</th>

<th>

Valor

</th>

<th>

Estado

</th>

<th>

Acciones

</th>

</tr>

</thead>

<tbody>

<tr

*ngFor="let item of completed">

<td>

<strong>

{{item.cliente}}

</strong>

<br>

{{item.empresa}}

</td>

<td>

{{item.fecha}}

</td>

<td>

{{item.valor_cobrado}}

</td>

<td>

{{item.estado}}

</td>

<td>

<button

(click)="edit(item)">

Editar

</button>

<button

(click)="openProducts(item)">

Productos

</button>

<button

(click)="remove(item)">

Eliminar

</button>

</td>

</tr>

</tbody>

</table>

<div class="footer">

<button

class="cancel"

(click)="closeModal()">

Cerrar

</button>

</div>

</div>

</div>

<app-service-products

[show]="showProducts"

[completedServiceId]="selectedCompleted"

(close)="showProducts=false">

</app-service-products>
