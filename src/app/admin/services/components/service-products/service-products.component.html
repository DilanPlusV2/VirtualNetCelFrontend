<div
class="modal"
*ngIf="show">

<div class="card">

<div class="header">

<h2>

Productos utilizados

</h2>

<button

class="new"

(click)="newRelation()">

Nuevo

</button>

</div>

<div class="form">

<label>

Producto

</label>

<select

[(ngModel)]="form.producto_id">

<option

[value]="0">

Seleccione

</option>

<option

*ngFor="let product of products"

[value]="product.id">

{{product.nombre}}

</option>

</select>

<label>

Cantidad utilizada

</label>

<input

type="number"

min="1"

[(ngModel)]="form.cantidad_utilizada">

<div class="buttons">

<button

class="save"

(click)="save()">

{{editing?'Actualizar':'Guardar'}}

</button>

</div>

</div>

<table>

<thead>

<tr>

<th>

Producto

</th>

<th>

Cantidad

</th>

<th>

Acciones

</th>

</tr>

</thead>

<tbody>

<tr

*ngFor="let relation of relations">

<td>

{{relation.producto?.nombre}}

</td>

<td>

{{relation.cantidad_utilizada}}

</td>

<td>

<button

class="edit"

(click)="edit(relation)">

Editar

</button>

<button

class="delete"

(click)="remove(relation)">

Eliminar

</button>

</td>

</tr>

</tbody>

</table>

<div class="footer">

<button

class="cancel"

(click)="closeModal()">

Cerrar

</button>

</div>

</div>

</div>
