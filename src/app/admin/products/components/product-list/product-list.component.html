<h1>

Productos

</h1>

<div class="toolbar">

<input

[(ngModel)]="search"

(input)="filter()"

placeholder="Buscar producto...">

<button (click)="newProduct()">

+ Nuevo Producto

</button>

</div>

<table>

<thead>

<tr>

<th>Nombre</th>

<th>Categoría</th>

<th>Stock</th>

<th>Precio</th>

<th>Estado</th>

<th>

Acciones

</th>

</tr>

</thead>

<tbody>

<tr

*ngFor="let p of filteredProducts">


<td>

{{p.nombre}}

</td>

<td>

{{p.categoria?.nombre}}

</td>

<td>

{{p.stock}}

</td>

<td>

{{p.precio_venta|

number}}

</td>

<td>

{{

p.activo?

'Activo':'Inactivo'

}}

</td>

<td>

<button

(click)="edit(p)">

Editar

</button>

</td>

</tr>

</tbody>

</table>

<app-product-form

    *ngIf="showForm"

    [product]="selectedProduct"

    (close)="showForm=false"

    (saved)="reload()">

</app-product-form>
